name: ports-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ubridge:
    name: net/ubridge (FreeBSD)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate port
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y git portlint
          run: |
            set -e
            if [ ! -d /usr/ports/Mk ]; then
              git clone --depth 1 https://git.FreeBSD.org/ports.git /usr/ports
            fi

            export PORTSDIR=/usr/ports
            export DISTDIR=/tmp/distfiles
            mkdir -p "$DISTDIR"

            cd "$GITHUB_WORKSPACE/ports/net/ubridge"
            make makesum
            portlint -AC
            make stage
            make check-plist
            make stage-qa DEVELOPER=yes

            # o binario staged tem que executar e reportar a versao
            ./work/stage/usr/local/bin/ubridge -v

  gns3-server:
    name: net/gns3-server (FreeBSD)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate port
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y git portlint
          run: |
            set -e
            if [ ! -d /usr/ports/Mk ]; then
              git clone --depth 1 https://git.FreeBSD.org/ports.git /usr/ports
            fi

            export PORTSDIR=/usr/ports
            export DISTDIR=/tmp/distfiles
            export PORT_DBDIR=/tmp/portdb
            mkdir -p "$DISTDIR" "$PORT_DBDIR"

            cd "$GITHUB_WORKSPACE"
            ./scripts/register-ids.sh /usr/ports
            cp -R "$GITHUB_WORKSPACE/ports/net/ubridge" /usr/ports/net/

            PYTHON_DEFAULT=$(make -C /usr/ports/lang/python3 -V PYTHON_DEFAULT)
            PYTHON_FLAVOR=$(echo "$PYTHON_DEFAULT" | tr -d '.')
            pkg install -y "py${PYTHON_FLAVOR}-build" \
              "py${PYTHON_FLAVOR}-installer" "py${PYTHON_FLAVOR}-setuptools" \
              "py${PYTHON_FLAVOR}-wheel"

            cd "$GITHUB_WORKSPACE/ports/net/gns3-server"
            make makesum
            portlint -AC
            make stage NO_DEPENDS=yes
            make check-plist
            make stage-qa DEVELOPER=yes
            ./work/stage/usr/local/bin/gns3server --version
            sh -n ./work/stage/usr/local/etc/rc.d/gns3server
